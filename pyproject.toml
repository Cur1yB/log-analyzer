[project]
name = "log-analyzer"
version = "1.0"
description = "Log Analyzer for *.log files where each line is JSON object"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coverage>=7.10.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
    "tabulate>=0.9.0",
    "asciinema>=2.4.0",
]

[pytest]
python_files = "test_*.py"

[project.scripts]
analyze = "log_analyzer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["log_analyzer"]
